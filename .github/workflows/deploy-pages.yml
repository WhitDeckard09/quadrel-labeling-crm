# Optional: publish to GitHub Pages.
#
# Only needed if you deploy via GitHub Pages rather than Cloudflare Pages.
# Pages serves from https://<user>.github.io/<repo>/, so the build sets
# VITE_BASE to that subpath. Cloudflare Pages serves from a root and needs
# neither this workflow nor VITE_BASE.
#
# To enable: repo Settings → Pages → Source: "GitHub Actions".
# Note: GitHub Pages has no access control — the site is public to anyone with
# the link. Use Cloudflare Pages + Access if it needs a password.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - name: SPA fallback
        # Pages serves 404.html for unknown paths; making it a copy of index.html
        # lets client-side routes survive a direct hit or a refresh.
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
